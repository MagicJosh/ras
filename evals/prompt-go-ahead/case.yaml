schema_version: "1.1"
name: prompt-go-ahead
description: A small ask that deletes a file does not take the fast path. prompt shows the prompt and waits.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/prompt delete test_calc.py'
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, AskUserQuestion]
graders:
  - name: still-there
    type: regex
    target: { source: file, path: test_calc.py }
    pattern: 'is_even'
  - name: shows-prompt
    type: regex
    pattern: '\*\*Prompt\*\*'
    arm: with-only
  - name: offers-run
    type: regex
    pattern: 'Run it here'
    arm: with-only
