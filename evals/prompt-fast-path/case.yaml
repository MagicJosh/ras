schema_version: "1.1"
name: prompt-fast-path
description: A small, fully specified ask takes the fast path. prompt asks nothing and does the rename in the same run.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/prompt rename is_even to is_even_number everywhere'
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, AskUserQuestion]
graders:
  - name: renamed
    type: regex
    target: { source: file, path: calc.py }
    pattern: 'def is_even_number'
  - name: callers-updated
    type: regex
    target: { source: file, path: app.py }
    pattern: 'is_even\('
    match: not_contains
  - name: tests-updated
    type: regex
    target: { source: file, path: test_calc.py }
    pattern: 'is_even_number'
  - name: no-questions
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
