schema_version: "1.1"
name: which
description: /which names the right skill for a request.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/which I want to split my backend into services'
  max_turns: 10
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: names-skill
    type: regex
    pattern: distributed-architecture
  - name: short-answer
    type: llm
    criteria: >-
      PASS if the reply names one or two skills, gives one line of reason for
      each, and then stops. FAIL if it names three or more skills, or starts on
      the task itself.
