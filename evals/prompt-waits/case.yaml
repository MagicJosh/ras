schema_version: "1.1"
name: prompt-waits
description: An ask with open details lists its guesses as assumptions, shows the prompt and stops before it edits app.py.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/prompt add a --json flag to app.py'
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, AskUserQuestion]
graders:
  - name: app-unchanged
    type: regex
    target: { source: file, path: app.py }
    pattern: 'json'
    flags: i
    match: not_contains
  - name: shows-prompt
    type: regex
    pattern: '\*\*Prompt\*\*'
    arm: with-only
  - name: lists-assumptions
    type: regex
    pattern: '\*\*Assumptions\*\*'
    arm: with-only
  - name: offers-run
    type: regex
    pattern: 'Run it here'
    arm: with-only
  - name: no-questions
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
  - name: traceable
    type: llm
    criteria: >-
      PASS if every requirement inside the fenced prompt block is stated in the
      user's request, visible in the repository files (app.py, calc.py,
      test_calc.py), or listed under the Assumptions heading of the same reply.
      FAIL if the prompt block states a requirement, a reason or a limit that
      has none of those three sources.
    arm: with-only
