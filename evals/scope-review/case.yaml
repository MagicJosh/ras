schema_version: "1.1"
name: scope-review
description: /scope-review hands the spec's scope and the diff to the scope-reviewer agent. The report names the edit to app.py as out of scope, and nothing is reverted.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/scope-review'
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash, Agent]
graders:
  - name: reviewer-ran
    type: tool_used
    tool: Agent
    input_match: 'ras:scope-reviewer'
    arm: with-only
  - name: names-app-out-of-scope
    type: llm
    criteria: >-
      PASS if the reply reports the change to app.py (a new --quiet option) as out of scope,
      and does not report the fix in calc.py as out of scope. FAIL otherwise, or if the reply
      holds no report.
  - name: report-saved
    type: tool_used
    tool: Write
    input_match: 'review-20[0-9]{2}-.*report\.md'
    arm: with-only
  - name: app-edit-kept
    type: regex
    target: { source: file, path: app.py }
    pattern: '--quiet'
  - name: calc-fix-kept
    type: regex
    target: { source: file, path: calc.py }
    pattern: '%\s*2\s*==\s*0'
