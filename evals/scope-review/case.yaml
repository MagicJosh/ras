schema_version: "1.1"
name: scope-review
description: /scope-review starts the scope-reviewer agent, which runs the review script itself. The report names the edit to app.py as out of scope, and nothing is reverted.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/scope-review'
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Bash, Agent]
graders:
  - name: reviewer-ran
    type: tool_used
    tool: Agent
    input_match: 'ras:scope-reviewer'
    arm: with-only
  - name: names-app-out-of-scope
    # Exactly one out-of-scope hunk, and it is app.py, so calc.py is not reported. A regex and not
    # an llm judge: the judge failed 3 of 9 runs, and the two failed replies that were read held this exact report.
    type: regex
    pattern: 'Result: 1 hunks? out of scope[\s\S]*## Out of scope\s+1\. `?app\.py'
  - name: report-saved
    type: tool_used
    tool: Write
    input_match: 'review-20[0-9]{2}-.*report\.md'
    arm: with-only
  - name: app-edit-kept
    type: regex
    target: { source: file, path: app.py }
    pattern: '--quiet'
  - name: calc-fix-kept
    type: regex
    target: { source: file, path: calc.py }
    pattern: '%\s*2\s*==\s*0'
