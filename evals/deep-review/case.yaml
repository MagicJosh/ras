schema_version: "1.1"
name: deep-review
description: An explicit deep review request loads deep-review.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Run a deep review of the code quality of this repo. Do not change code.'
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"ras:deep-review"'
