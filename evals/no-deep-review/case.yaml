schema_version: "1.1"
name: no-deep-review
description: A normal diff review loads neither deep-review nor which.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Review this diff: run git diff and tell me if it is fine.'
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
graders:
  - name: no-deep-review
    type: tool_used
    tool: Skill
    input_match: 'ras:deep-review'
    min: 0
    max: 0
    arm: both
  - name: no-which
    type: tool_used
    tool: Skill
    input_match: 'ras:which'
    min: 0
    max: 0
    arm: both
