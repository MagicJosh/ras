schema_version: "1.1"
name: hook-blocks-edit
description: A direct edit request goes through the spec gate (denied edit or spec loaded), and calc.py stays unchanged.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Add a one-line docstring to is_even in calc.py. Edit the file directly now.'
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: gated
    type: regex
    target: trace
    pattern: '\(skill: spec\)|ras:spec\b'
    arm: with-only
  - name: calc-unchanged
    type: regex
    target: { source: file, path: calc.py }
    pattern: '"""'
    match: not_contains
