schema_version: "1.1"
name: architecture
description: A monolith question loads architecture.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'This app will grow a lot. Should it stay a monolith or become a modular monolith? Weigh the trade-offs, do not change code.'
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"ras:architecture"'
  - name: weighs-trade-offs
    type: llm
    criteria: >-
      PASS if the reply names the quality characteristics that drive the choice
      and limits or ranks them, compares both styles against those
      characteristics, says what the recommended style costs or gives up, and
      ends with one recommendation. FAIL if it recommends a style without saying
      what is given up, or lists general pros and cons that are tied to no named
      characteristic.
