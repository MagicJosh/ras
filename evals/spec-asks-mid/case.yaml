schema_version: "1.1"
name: spec-asks-mid
description: A request with two reasonable readings ("nicer output") makes spec ask before it writes the spec.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Make the output of the app nicer.'
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, AskUserQuestion]
graders:
  - name: asked
    type: regex
    pattern: '\?'
  - name: no-spec-yet
    type: file_exists
    path: specs/current.md
    exists: false
  - name: app-unchanged
    type: regex
    target: { source: file, path: app.py }
    pattern: 'f"|format|:<|rjust|ljust|tabulate|color|\\033'
    flags: i
    match: not_contains
