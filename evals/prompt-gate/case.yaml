schema_version: "1.1"
name: prompt-gate
description: A task on a path the session locks until a spec is approved gets a prompt that starts at that gate, and no workflow file is written.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/prompt add a GitHub Actions workflow that runs test_calc.py on every push'
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, AskUserQuestion]
graders:
  - name: no-ci-write
    type: tool_used
    tool: Write
    input_match: '\.github'
    min: 0
    max: 0
  - name: names-gate
    type: regex
    pattern: '(ras:|/|`)spec\b'
    arm: with-only
  - name: shows-prompt
    type: regex
    pattern: '\*\*Prompt\*\*'
    arm: with-only
