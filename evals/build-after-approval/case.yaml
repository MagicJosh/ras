schema_version: "1.1"
name: build-after-approval
description: After approve spec, build loads, fixes the bug and runs the test.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'approve spec'
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"ras:build"'
  - name: bug-gone
    type: regex
    target: { source: file, path: calc.py }
    pattern: '%\s*2\s*==\s*1'
    match: not_contains
  - name: test-ran
    type: tool_used
    tool: Bash
    input_match: 'test_calc\.py'
