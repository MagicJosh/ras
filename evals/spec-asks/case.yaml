schema_version: "1.1"
name: spec-asks
description: A vague change request makes spec ask clarifying questions, and stop, before it writes the spec.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Add an export feature to the app.'
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, AskUserQuestion]
graders:
  - name: asked
    type: regex
    pattern: '\?'
  - name: no-spec-yet
    type: file_exists
    path: specs/current.md
    exists: false
  - name: app-unchanged
    type: regex
    target: { source: file, path: app.py }
    pattern: 'export|csv|json'
    flags: i
    match: not_contains
