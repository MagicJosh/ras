schema_version: "1.1"
name: module-design
description: A module interface request loads architecture, which reads references/deep-modules.md.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'We need a module in this repo that rate-limits calls to a weather API. Design its interface and compare a few designs. Do not change code.'
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: reference-read
    type: tool_used
    tool: Read
    input_match: 'deep-modules\.md'
    arm: with-only
