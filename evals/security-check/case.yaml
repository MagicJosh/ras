schema_version: "1.1"
name: security-check
description: A destructive admin feature loads security-check, and the spec gets a Security section.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: 'Add delete_user(actor_id, user_id) to users.py. It deletes the user and all their orders. Only admins may call it.'
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"ras:security-check"'
  - name: security-section
    type: regex
    target: { source: file, path: specs/current.md }
    pattern: '^## Security'
    flags: m
