schema_version: "1.1"
name: prompt-away
description: When the ask says the user is leaving, prompt asks nothing, builds the flag in the same run and leaves the nearby bug in calc.py alone.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/prompt add a --json flag to app.py that prints the results as JSON. im going to bed, just get it done'
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, AskUserQuestion]
graders:
  - name: flag-built
    type: regex
    target: { source: file, path: app.py }
    pattern: 'json'
    flags: i
  - name: calc-untouched
    type: regex
    target: { source: file, path: calc.py }
    pattern: '%\s*2\s*==\s*1'
  - name: no-questions
    type: tool_used
    tool: AskUserQuestion
    min: 0
    max: 0
