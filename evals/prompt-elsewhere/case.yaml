schema_version: "1.1"
name: prompt-elsewhere
description: A prompt for another LLM pastes the code it needs, leaves out home paths and the effort line, and changes no file.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/prompt i want chatgpt to explain to me how the check in calc.py works'
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, AskUserQuestion]
graders:
  - name: ready-to-copy
    type: regex
    pattern: 'Ready to copy'
    arm: with-only
  - name: code-pasted
    type: regex
    pattern: 'n\s*%\s*2'
  - name: no-effort
    type: regex
    pattern: '\*\*Effort\*\*'
    match: not_contains
  - name: no-home-path
    type: regex
    pattern: '[A-Za-z]:\\Users|/home/|/Users/'
    match: not_contains
  - name: calc-unchanged
    type: regex
    target: { source: file, path: calc.py }
    pattern: '%\s*2\s*==\s*1'
