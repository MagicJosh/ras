schema_version: "1.1"
name: spar-no-adr
description: After the user confirms an easy-to-reverse button label, /ras:spar offers no ADR and writes nothing.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: '/ras:spar Back to the checkout page. Your last round is answered and nothing is open. I confirm the list: 1. The checkout button says "Place order", not "Buy now", because support asked for it. 2. The page stays in this repo.'
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Write]
graders:
  - name: no-adr-offer
    type: regex
    pattern: '\bADRs?\b|docs/adr'
    flags: i
    match: not_contains
  - name: no-adr-file
    type: tool_used
    tool: Write
    input_match: 'docs/adr'
    min: 0
    max: 0
